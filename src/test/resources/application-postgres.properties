# En este perfil la conexión se hace con una base de datos diferente: mads_test,
# para no sobreescribir la base de datos definida en el perfil de ejecución.
#
# Recuerda que en el perfil por defecto resources/application.properties se define
# el valor de spring.jpa.hibernate.ddl-auto como create. De esta forma la base de
# datos se inicializa antes de cargar los datos de los tests y de ejecutarlos.
# También usamos una base de datos distinta (mads_test) para no sobreescribir la
# base de datos definida en el perfil de ejecución.

# Para tener más flexibilidad en la configuración de la conexión con PostgreSQL vamos a
# modificar el perfil de Spring Boot, añadiendo unas variables con unos valores por
# defecto que se pueden modificar definiendo su valor en variables de entorno con el
# mismo nombre.
POSTGRES_HOST=localhost
POSTGRES_PORT=5432
DB_USER=mads
DB_PASSWD=mads
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/mads_test
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWD}
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQL9Dialect
