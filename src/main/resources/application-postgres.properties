# Este va a ser el perfil que activemos para utilizar la conexión con la BD PostgreSQL.
#
# En este fichero de configuración se define la URL de conexión a la base de datos mads,
# su usuario (mads) y contraseña (mads) y el dialecto que se va a utilizar para trabajar
# desde JPA con la base de datos (org.hibernate.dialect.PostgreSQL9Dialect). La base de
# datos PostgreSQL debe estar funcionando en el puerto 5432 del localhost.

spring.datasource.url=jdbc:postgresql://localhost:5432/mads
spring.datasource.username=mads
spring.datasource.password=mads
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQL9Dialect
