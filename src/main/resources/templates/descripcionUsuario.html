<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Descripción de usuario')"></head>

<body>

<nav th:replace="fragments :: menu (usuario=${usuario}, logeado=${logeado})"></nav>

<div class="container-fluid">

    <div class="row mt-3">
        <div class="col">
            <h2>Descripción de usuario</h2>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col">
            <table class="table">
                <tbody>
                <tr>
                    <th>Id</th>
                    <td th:text="${usuarioRegistrado.id}"></td>
                </tr>
                <tr>
                    <th>Email</th>
                    <td th:text="${usuarioRegistrado.email}"></td>
                </tr>
                <tr>
                    <th>Nombre</th>
                    <td th:text="${usuarioRegistrado.nombre}"></td>
                </tr>
                <tr>
                    <th>Fecha de nacimiento</th>
                    <td th:text="${usuarioRegistrado.fechaNacimiento != null} ? ${#dates.format(usuarioRegistrado.fechaNacimiento, 'dd/MM/yyyy')} : '-'"></td>
                </tr>
                </tbody>
            </table>
            <a class="btn btn-link" th:href="@{/registrados}">Volver al listado</a>
        </div>
    </div>
</div>

<div th:replace="fragments::javascript"/>

</body>
</html>
