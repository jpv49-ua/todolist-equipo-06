<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Detalle de tarea')"></head>

<body>

<nav th:replace="fragments :: menu (usuario=${usuario}, logeado=true)"></nav>

<div class="container-fluid">

    <div class="row mt-3">
        <div class="col">
            <h2 th:text="'Tarea: ' + ${tarea.titulo}"></h2>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col">
            <h4>Comentario</h4>
            <p th:if="${#strings.isEmpty(tarea.comentario)}">La tarea no tiene comentario.</p>
            <div th:unless="${#strings.isEmpty(tarea.comentario)}">
                <p id="comentario" th:text="${tarea.comentario}"></p>
                <button class="btn btn-outline-danger btn-sm" onmouseover="" style="cursor: pointer;"
                        th:onclick="'del(\'/tareas/' + ${tarea.id} + '/comentario\')'"><svg th:replace="fragments :: iconoBorrar"></svg> Borrar comentario</button>
            </div>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col-6">
            <form method="post" th:action="@{/tareas/{id}/comentario(id=${tarea.id})}" th:object="${tareaData}">
                <div class="form-group">
                    <label for="comentario-texto"
                           th:text="${#strings.isEmpty(tarea.comentario)} ? 'Añadir comentario:' : 'Modificar comentario:'"></label>
                    <textarea class="form-control" id="comentario-texto" name="comentario" required
                              th:text="*{comentario}" rows="3"></textarea>
                </div>
                <button class="btn btn-outline-primary" type="submit">Guardar comentario</button>
                <a class="btn btn-link" th:href="@{/usuarios/{id}/tareas(id=${tarea.usuarioId})}">Volver a las tareas</a>
            </form>
        </div>
    </div>

    <div class="row mt-2">
        <div class="col">
            <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${!#strings.isEmpty(mensaje)}">
                <span th:text="${mensaje}"></span>
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${!#strings.isEmpty(error)}">
                <span th:text="${error}"></span>
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments::javascript"/>

<!-- Lanzamos una petición DELETE por JavaScript para borrar el comentario -->
<script type="text/javascript">
    function del(urlBorrar) {
        if (confirm('¿Estás seguro/a de que quieres borrar el comentario?')) {
            fetch(urlBorrar, {
                method: 'DELETE'
            }).then((res) => location.reload());
        }
    }
</script>

</body>
</html>
