<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Editar perfil')"></head>

<body>

<nav th:replace="fragments :: menu (usuario=${usuario}, logeado=true)"></nav>

<div class="container-fluid mt-3">

    <h2>Editar perfil</h2>

    <form method="post" th:action="@{/cuenta/editar}" th:object="${perfilData}">
        <div class="col-6">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input id="email" class="form-control" name="email" type="text"
                       th:field="*{email}" required/>
            </div>
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input id="nombre" class="form-control" name="nombre" type="text"
                       th:field="*{nombre}"/>
            </div>
            <div class="form-group">
                <label for="fechaNacimiento">Fecha de nacimiento</label>
                <input id="fechaNacimiento" class="form-control" name="fechaNacimiento"
                       placeholder="01-12-2019" th:field="*{fechaNacimiento}"/>
            </div>

            <button class="btn btn-outline-primary" type="submit">Guardar cambios</button>
            <a class="btn btn-link" th:href="@{/cuenta}">Cancelar</a>
        </div>
    </form>

    <div class="row mt-3">
        <div class="col-6">
            <div th:object="${perfilData}">
                <ul th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                </ul>
            </div>
            <ul th:if="${error != null}" class="alert alert-danger">
                <li th:text="${error}"></li>
            </ul>
        </div>
    </div>
</div>

<div th:replace="fragments::javascript"/>

</body>
</html>
