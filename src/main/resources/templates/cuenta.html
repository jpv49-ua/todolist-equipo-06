<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Cuenta')"></head>

<body>

<nav th:replace="fragments :: menu (usuario=${usuario}, logeado=${logeado})"></nav>

<div class="container-fluid">

    <div class="row mt-3">
        <div class="col">
            <h2>Cuenta</h2>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col">
            <table class="table">
                <tbody>
                <tr>
                    <th>Id</th>
                    <td th:text="${usuario.id}"></td>
                </tr>
                <tr>
                    <th>Email</th>
                    <td th:text="${usuario.email}"></td>
                </tr>
                <tr>
                    <th>Nombre</th>
                    <td th:text="${usuario.nombre}"></td>
                </tr>
                <tr>
                    <th>Fecha de nacimiento</th>
                    <td th:text="${usuario.fechaNacimiento != null} ? ${#dates.format(usuario.fechaNacimiento, 'dd/MM/yyyy')} : '-'"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="fragments::javascript"/>

</body>
</html>
