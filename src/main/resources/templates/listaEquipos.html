<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Equipos')"></head>

<body>

<nav th:replace="fragments :: menu (usuario=${usuario}, logeado=${logeado})"></nav>

<div class="container-fluid">

    <div class="row mt-3">
        <div class="col">
            <h2>Listado de equipos</h2>
            <a class="btn btn-success" th:href="@{/equipos/nuevo}">Crear equipo</a>
        </div>
    </div>

    <div class="row mt-3" th:if="${!#strings.isEmpty(mensaje) or !#strings.isEmpty(error)}">
        <div class="col">
            <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${!#strings.isEmpty(mensaje)}">
                <span th:text="${mensaje}"></span>
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${!#strings.isEmpty(error)}">
                <span th:text="${error}"></span>
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Id</th>
                    <th>Nombre</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="equipo: ${equipos}">
                    <td th:text="${equipo.id}"></td>
                    <td><a th:href="@{/equipos/{id}(id=${equipo.id})}" th:text="${equipo.nombre}"></a></td>
                    <td>
                        <a class="btn btn-primary btn-xs"
                           th:href="@{/equipos/{id}(id=${equipo.id})}">Ver miembros</a>
                        <form class="d-inline" method="post" th:if="${idsEquiposUsuario.contains(equipo.id)}"
                              th:action="@{/equipos/{id}/salir(id=${equipo.id})}">
                            <button class="btn btn-danger btn-xs" type="submit">Salir</button>
                        </form>
                        <form class="d-inline" method="post" th:unless="${idsEquiposUsuario.contains(equipo.id)}"
                              th:action="@{/equipos/{id}/unirse(id=${equipo.id})}">
                            <button class="btn btn-success btn-xs" type="submit">Unirme</button>
                        </form>
                        <a class="btn btn-warning btn-xs" th:if="${usuario.admin}"
                           th:href="@{/equipos/{id}/editar(id=${equipo.id})}">Editar</a>
                        <form class="d-inline" method="post" th:if="${usuario.admin}"
                              th:action="@{/equipos/{id}/eliminar(id=${equipo.id})}"
                              onsubmit="return confirm('¿Estás seguro/a de que quieres eliminar el equipo?');">
                            <button class="btn btn-danger btn-xs" type="submit">Eliminar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="fragments::javascript"/>

</body>
</html>
