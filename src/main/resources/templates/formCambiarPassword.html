<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Cambiar contraseña')"></head>

<body>

<nav th:replace="fragments :: menu (usuario=${usuario}, logeado=true)"></nav>

<div class="container-fluid mt-3">

    <h2>Cambiar contraseña</h2>

    <form method="post" th:action="@{/cuenta/contrasena}" th:object="${passwordData}">
        <div class="col-6">
            <div class="form-group">
                <label for="passwordActual">Contraseña actual</label>
                <input id="passwordActual" class="form-control" name="passwordActual" type="password"
                       th:field="*{passwordActual}" required/>
            </div>
            <div class="form-group">
                <label for="passwordNueva">Contraseña nueva</label>
                <input id="passwordNueva" class="form-control" name="passwordNueva" type="password"
                       th:field="*{passwordNueva}" required/>
            </div>
            <div class="form-group">
                <label for="passwordNuevaRepetida">Repetir contraseña nueva</label>
                <input id="passwordNuevaRepetida" class="form-control" name="passwordNuevaRepetida" type="password"
                       th:field="*{passwordNuevaRepetida}" required/>
            </div>

            <button class="btn btn-outline-primary" type="submit">Cambiar contraseña</button>
            <a class="btn btn-link" th:href="@{/cuenta}">Cancelar</a>
        </div>
    </form>

    <div class="row mt-3">
        <div class="col-6">
            <ul th:if="${error != null}" class="alert alert-danger">
                <li th:text="${error}"></li>
            </ul>
        </div>
    </div>
</div>

<div th:replace="fragments::javascript"/>

</body>
</html>
