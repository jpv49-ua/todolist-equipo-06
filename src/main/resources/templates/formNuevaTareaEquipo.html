<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Nueva tarea del equipo')"></head>

<body>

<nav th:replace="fragments :: menu (usuario=${usuario}, logeado=${logeado})"></nav>

<div class="container-fluid mt-4">

    <div class="row">
        <div class="col-md-7">

            <h2>Nueva tarea</h2>
            <p class="text-muted" th:text="'Equipo ' + ${equipo.nombre}"></p>

            <div class="alert alert-danger alert-dismissible fade show" role="alert"
                 th:if="${!#strings.isEmpty(error)}">
                <span th:text="${error}"></span>
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div class="card border">
                <div class="card-header bg-light">
                    <strong>Datos de la tarea</strong>
                </div>
                <div class="card-body">
                    <form id="formTarea" method="post"
                          th:action="@{/equipos/{id}/tareas/nueva(id=${equipo.id})}"
                          th:object="${tareaData}">

                        <div class="form-group">
                            <label for="titulo">¿Qué hay que hacer?</label>
                            <input class="form-control" id="titulo" name="titulo" required
                                   th:field="*{titulo}" type="text" placeholder="Ej. Cortar la cebolla"/>
                        </div>

                        <div class="form-group mb-0">
                            <label for="usuarioId">¿Quién se encarga?</label>
                            <select class="form-control" id="usuarioId" name="usuarioId" required
                                    th:field="*{usuarioId}">
                                <option th:each="miembro : ${miembros}" th:value="${miembro.id}"
                                        th:text="${miembro.nombre} ?: ${miembro.email}"></option>
                            </select>
                            <small class="form-text text-muted">Solo puedes asignarla a miembros del equipo.</small>
                        </div>
                    </form>
                </div>
                <div class="card-footer bg-white">
                    <button class="btn btn-primary" type="submit" form="formTarea">Crear tarea</button>
                </div>
            </div>

            <div class="mt-3">
                <a class="btn btn-link pl-0" th:href="@{/equipos/{id}(id=${equipo.id})}">&larr; Volver al equipo</a>
            </div>

        </div>
    </div>
</div>

<div th:replace="fragments::javascript"/>

</body>
</html>
