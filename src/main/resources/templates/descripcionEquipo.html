<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Equipo')"></head>

<body>

<nav th:replace="fragments :: menu (usuario=${usuario}, logeado=${logeado})"></nav>

<div class="container-fluid">

    <div class="row mt-3">
        <div class="col">
            <h2 th:text="'Equipo ' + ${equipo.nombre}"></h2>
            <form class="d-inline" method="post" th:if="${esMiembro}"
                  th:action="@{/equipos/{id}/salir(id=${equipo.id})}">
                <button class="btn btn-outline-danger" type="submit">Salir del equipo</button>
            </form>
            <form class="d-inline" method="post" th:unless="${esMiembro}"
                  th:action="@{/equipos/{id}/unirse(id=${equipo.id})}">
                <button class="btn btn-outline-success" type="submit">Unirme al equipo</button>
            </form>
            <a class="btn btn-outline-primary" th:if="${usuario.admin}"
               th:href="@{/equipos/{id}/editar(id=${equipo.id})}"><svg th:replace="fragments :: iconoEditar"></svg> Editar equipo</a>
            <form class="d-inline" method="post" th:if="${usuario.admin}"
                  th:action="@{/equipos/{id}/eliminar(id=${equipo.id})}"
                  onsubmit="return confirm('¿Estás seguro/a de que quieres eliminar el equipo?');">
                <button class="btn btn-outline-danger" type="submit"><svg th:replace="fragments :: iconoBorrar"></svg> Eliminar equipo</button>
            </form>
        </div>
    </div>

    <div class="row mt-3" th:if="${!#strings.isEmpty(mensaje) or !#strings.isEmpty(error)}">
        <div class="col">
            <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${!#strings.isEmpty(mensaje)}">
                <span th:text="${mensaje}"></span>
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${!#strings.isEmpty(error)}">
                <span th:text="${error}"></span>
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col">
            <h4>Miembros</h4>
            <p th:if="${#lists.isEmpty(miembros)}">Este equipo todavía no tiene miembros.</p>
            <table class="table table-striped" th:unless="${#lists.isEmpty(miembros)}">
                <thead>
                <tr>
                    <th>Id</th>
                    <th>Nombre</th>
                    <th>Email</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="miembro: ${miembros}">
                    <td th:text="${miembro.id}"></td>
                    <td th:text="${miembro.nombre}"></td>
                    <td th:text="${miembro.email}"></td>
                </tr>
                </tbody>
            </table>
            <a class="btn btn-link" th:href="@{/equipos}">Volver al listado</a>
        </div>
    </div>
</div>

<div th:replace="fragments::javascript"/>

</body>
</html>
